name: Deploy archived API documentation

on:
  push:
    branches:
      - feature/local-demo
    paths:
      - "api-docs/index.html"
      - "api-docs/app.js"
      - "api-docs/openapi.json"
      - "api-docs/vendor/**"
      - ".github/workflows/deploy-api-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ydl-api-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout API documentation
        uses: actions/checkout@v4

      - name: Verify static API documentation
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            api-docs/index.html \
            api-docs/app.js \
            api-docs/openapi.json \
            api-docs/vendor/swagger-ui.css \
            api-docs/vendor/swagger-ui-bundle.js; do
            if [ ! -s "$file" ]; then
              echo "Missing or empty: $file" >&2
              exit 1
            fi
          done
          python3 -m json.tool api-docs/openapi.json >/dev/null
          echo "Static Swagger UI and OpenAPI JSON are ready"

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/ydl-api-pages"
          mkdir -p "$site/vendor"
          cp api-docs/index.html api-docs/app.js api-docs/openapi.json "$site/"
          cp api-docs/vendor/swagger-ui.css api-docs/vendor/swagger-ui-bundle.js "$site/vendor/"
          if [ -f api-docs/vendor/LICENSE ]; then cp api-docs/vendor/LICENSE "$site/vendor/"; fi
          if [ -f api-docs/vendor/NOTICE ]; then cp api-docs/vendor/NOTICE "$site/vendor/"; fi
          touch "$site/.nojekyll"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/ydl-api-pages
          include-hidden-files: true

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
